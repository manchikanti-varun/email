# Pin the Node version for Railway/Nixpacks. Node 24 has prebuilt binaries for
# better-sqlite3 (v13+, N-API), so no source compilation (and no Python/gcc) is
# needed. python3 + gcc are included anyway as a safety net for any native rebuild.
[phases.setup]
nixPkgs = ["nodejs_24", "python3", "gcc", "gnumake"]
